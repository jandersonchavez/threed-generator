[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "img23d"
version = "0.1.0"
description = "Imagem para geometria 3D local e preparação para impressão"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3", "Pillow>=10.4,<12", "trimesh>=4.6,<5",
  "scipy>=1.13,<2", "scikit-image>=0.24,<1", "rtree>=1.3,<2", "manifold3d>=3,<4",
  "rembg[cpu]>=2.0.60,<3", "huggingface-hub>=0.30,<1",
  "gradio>=5.23,<6", "fast-simplification>=0.1.9,<1",
]

[project.optional-dependencies]
ai = ["accelerate>=1,<2", "diffusers>=0.32,<0.36", "transformers>=4.48,<4.51", "safetensors>=0.5,<1", "omegaconf==2.3.0", "einops>=0.8,<1", "tqdm>=4.66", "PyYAML>=6", "opencv-python>=4.10", "pymeshlab>=2023.12", "pygltflib>=1.16", "xatlas>=0.0.9", "ninja", "pybind11", "imageio[ffmpeg]"]
test = ["pytest>=8,<9"]
sam2 = ["hydra-core>=1.3.2,<1.4", "iopath>=0.1.10,<0.2"]

[project.scripts]
img23d = "img23d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
